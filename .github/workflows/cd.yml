name: Flask CD

on:
  workflow_run:
    workflows: ["Flask CI"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /home/ec2-user
            sudo docker pull python:3.12-slim
            rm -rf dockerized-flask-cicd
            git clone https://github.com/reeshipahire7-arch/dockerized-flask-cicd.git
            cd dockerized-flask-cicd
            sudo docker stop flask-cicd-app || true
            sudo docker rm flask-cicd-app || true
            sudo docker build -t flask-cicd-app .
            sudo docker run -d -p 5000:5000 --name flask-cicd-app flask-cicd-app